{% for message in messages %}
  <div role="alert"
       class="mb-6 rounded border px-4 py-3 {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% elif message.tags == 'success' %}border-green-200 bg-green-50 text-green-800{% else %}border-blue-200 bg-blue-50 text-blue-800{% endif %}">
    {{ message }}
  </div>
{% endfor %}
