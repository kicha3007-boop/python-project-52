<nav class="bg-gray-100">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-6 px-4 py-3">
    <a class="text-lg font-medium" href="{% url 'index' %}">Менеджер задач</a>
    <a class="text-gray-600 hover:text-gray-900" href="{% url 'users_index' %}">Пользователи</a>
    {% if user.is_authenticated %}
      <a class="text-gray-600 hover:text-gray-900" href="{% url 'statuses_index' %}">Статусы</a>
      <a class="text-gray-600 hover:text-gray-900" href="{% url 'labels_index' %}">Метки</a>
      <a class="text-gray-600 hover:text-gray-900" href="{% url 'tasks_index' %}">Задачи</a>
      <form class="ml-auto" action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <input class="cursor-pointer text-gray-600 hover:text-gray-900" type="submit" value="Выход">
      </form>
    {% else %}
      <a class="ml-auto text-gray-600 hover:text-gray-900" href="{% url 'login' %}">Вход</a>
      <a class="text-gray-600 hover:text-gray-900" href="{% url 'users_create' %}">Регистрация</a>
    {% endif %}
  </div>
</nav>
